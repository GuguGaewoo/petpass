name: TourAPI data sync

# 목적: 매일 KTO(한국관광공사) Open API 최신 상태를 Supabase places 에 반영.
#
# 필요 Secrets (Settings → Secrets and variables → Actions):
#   TOUR_API_KEY
#   SUPABASE_URL
#   SUPABASE_SERVICE_KEY   ← service_role 키. anon 키 아님.

on:
  schedule:
    # 매일 08:00 KST = 전날 23:00 UTC
    #
    # 공사는 콘텐츠 수정일 기준으로 매일 새벽 04:30 과 07:30 두 차례
    # 동기화한다. 서비스별로 반영 시점이 갈리며, 우리가 쓰는 반려동물
    # 동반여행·국문 관광정보는 04:30 그룹이다.
    #
    # 05:00 이면 문서상 충분하지만 08:00 으로 잡는다. 두 창을 모두
    # 지나므로 해석 여지가 없고, 나중에 공사가 서비스 그룹을 조정해도
    # 영향을 받지 않는다. 하루 1회 동기화라 3시간 차이는 실질적 손해가
    # 없다.
    - cron: '0 23 * * *'

  # 수동 실행용. Actions 탭에서 바로 트리거해 확인할 수 있다.
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 의존성 설치
        run: pip install -r pipeline/requirements.txt

      - name: KTO 데이터 동기화
        env:
          TOUR_API_KEY: ${{ secrets.TOUR_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          cd pipeline
          python sync_service.py
