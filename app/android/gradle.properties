android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Kotlin 증분 컴파일 비활성화.
#
# 증분 컴파일러는 캐시에 파일 경로를 상대 경로로 저장하는데, 프로젝트와
# pub 캐시가 서로 다른 드라이브에 있으면 상대 경로를 만들 수 없어
# 빌드가 실패한다. Windows 에서만 발생한다.
#
#   프로젝트   I:\petpass\app\android
#   pub 캐시   C:\Users\<user>\AppData\Local\Pub\Cache
#   → IllegalArgumentException: this and base files have different roots
#
# 이 문제로 url_launcher_android, shared_preferences_android,
# flutter_naver_map 의 compileDebugKotlin 이 모두 실패했다.
#
# 끄면 매번 전체 컴파일을 하므로 재빌드가 조금 느려지지만, CI 와
# 릴리스 빌드는 어차피 매번 새로 빌드하므로 실질적인 손해는 작다.
#
# 프로젝트와 pub 캐시를 같은 드라이브에 두면 이 줄은 지워도 된다.
kotlin.incremental=false
